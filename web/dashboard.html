<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tree of Thought · dashboard</title>
<link rel="icon" id="icon" href="data:,">
<style>
/* Same family as gossip's dashboard: the terminal's own font and colours, panels
   with their title cut into the border. Colours come from your tot theme. */
:root {
  --bg: #101812; --fg: #dce7d6; --dim: #7d907c; --faint: #4d6150; --border: #2c4131; --panel: #1a2a1f; --code: #152119;
  --leaf: #8fd16a; --blossom: #f2a7c3; --bark: #b88a62; --sun: #f2d16b; --water: #7cc6d6; --err: #ff7b72; --warn: #f0b35a; --ok: #8fd16a;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0; padding: 1.4em 2.5ch 3em; color: var(--fg); max-width: 1500px; margin-inline: auto;
  font: 14px/1.6 ui-monospace, "SF Mono", "JetBrains Mono", Menlo, "Cascadia Mono", Consolas, "DejaVu Sans Mono", monospace;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--water); text-underline-offset: 2px; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--sun); outline-offset: 2px; }
[hidden] { display: none !important; }
.dim { color: var(--dim); } .faint { color: var(--faint); } .ok { color: var(--ok); } .warn { color: var(--warn); } .err { color: var(--err); }
.leaf { color: var(--leaf); } .blossom { color: var(--blossom); } .sun { color: var(--sun); }
canvas.px { image-rendering: pixelated; display: inline-block; vertical-align: middle; }

/* title bar */
header { display: flex; align-items: center; gap: 1.5ch; margin: 0 0 1em; flex-wrap: wrap; }
header canvas { width: 36px; height: auto; image-rendering: pixelated; }
header h1 { margin: 0; font-size: 1em; font-weight: 700; color: var(--leaf); }
header .rule { flex: 1; border-top: 1px solid var(--border); min-width: 4ch; }
.search { display: flex; align-items: center; gap: .6ch; border: 1px solid var(--border); border-radius: 6px; padding: .15em .9ch; }
.search:focus-within { border-color: var(--leaf); }
.search input { background: none; border: 0; outline: none; width: 24ch; }
.search kbd { color: var(--dim); font: inherit; border: 1px solid var(--border); border-radius: 4px; padding: 0 .6ch; font-size: .85em; }

/* sections, as a row of keys */
nav.tabs { display: flex; flex-wrap: wrap; gap: .6ch; margin: 0 0 2em; }
nav.tabs button { background: none; border: 1px solid transparent; border-radius: 6px; padding: .15em 1.3ch; color: var(--dim); }
nav.tabs button:hover { color: var(--fg); border-color: var(--border); }
nav.tabs button[aria-current="page"] { color: var(--bg); background: var(--leaf); border-color: var(--leaf); font-weight: 700; }
nav.tabs .n { opacity: .7; margin-left: .6ch; font-size: .9em; }

/* panels */
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 2.2em 2.5ch; align-items: start; }
.box { position: relative; border: 1px solid var(--border); border-radius: 9px; padding: 1.2em 2ch 1.1em; min-width: 0; transition: border-color .15s; }
.box:focus-within { border-color: color-mix(in srgb, var(--leaf) 45%, var(--border)); }
.box > h2 { position: absolute; top: -.82em; left: 1.6ch; margin: 0; padding: 0 .7ch; background: var(--bg); font: inherit; font-weight: 700; color: var(--blossom); max-width: calc(100% - 4ch); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.box > .aside { position: absolute; top: -.82em; right: 1.6ch; padding: 0 .7ch; background: var(--bg); color: var(--dim); display: flex; gap: .8ch; align-items: center; }
.w3 { grid-column: span 3; } .w4 { grid-column: span 4; } .w5 { grid-column: span 5; } .w6 { grid-column: span 6; } .w7 { grid-column: span 7; } .w8 { grid-column: span 8; } .w9 { grid-column: span 9; } .w12 { grid-column: span 12; }
.stack { display: grid; gap: 2.2em; align-content: start; min-width: 0; }
p.note { margin: 0 0 .9em; color: var(--dim); max-width: 78ch; }
p.note:last-child { margin-bottom: 0; }

/* controls */
.mini { background: none; border: 1px solid var(--border); border-radius: 5px; padding: 0 1.1ch; white-space: nowrap; text-decoration: none; color: inherit; }
.mini:hover:not(:disabled) { border-color: var(--leaf); color: var(--leaf); }
.mini.go { border-color: var(--leaf); color: var(--leaf); }
.mini.go:hover:not(:disabled) { background: var(--leaf); color: var(--bg); }
.mini.bad:hover:not(:disabled) { border-color: var(--err); color: var(--err); }
.mini:disabled { opacity: .45; cursor: default; }
.mini[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.line { display: flex; gap: 1ch; align-items: center; min-width: 0; }
.line .grow { flex: 1; min-width: 0; }
.field { background: none; border: 0; border-bottom: 1px solid var(--border); outline: none; padding: .15em 0; width: 100%; min-width: 0; }
.field:focus { border-color: var(--leaf); }
textarea.field { border: 1px solid var(--border); border-radius: 6px; padding: .5em 1ch; resize: vertical; line-height: 1.5; }
textarea.field:focus { border-color: var(--leaf); }
select.field { background: var(--bg); border: 1px solid var(--border); border-radius: 5px; padding: .1em .6ch; width: auto; max-width: 100%; }
.prompt { color: var(--leaf); font-weight: 700; }
.msg { min-height: 1.5em; color: var(--dim); margin-top: .5em; }
.msg.bad { color: var(--err); }
.pill { display: inline-block; padding: 0 .9ch; border-radius: 4px; background: color-mix(in srgb, var(--fg) 9%, transparent); color: var(--dim); white-space: nowrap; font-size: .92em; }
.pill.ok { color: var(--ok); } .pill.no { color: var(--err); } .pill.warn { color: var(--warn); }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-weight: 400; color: var(--dim); padding: 0 2ch .35em 0; border-bottom: 1px solid var(--border); }
td { padding: .35em 2ch .35em 0; vertical-align: top; overflow-wrap: anywhere; border-bottom: 1px dashed color-mix(in srgb, var(--border) 60%, transparent); }
tr:last-child td { border-bottom: 0; }
.empty { color: var(--dim); padding: 1.2em 0; }
.rows > * { padding: .5em 0; border-top: 1px dashed color-mix(in srgb, var(--border) 70%, transparent); }
.rows > *:first-child { border-top: 0; padding-top: 0; }

/* ask: the quick-question bar */
.ask .bar { display: flex; gap: 1ch; align-items: center; }
.ask .bar input { font-size: 1.05em; }
.ask .who { display: flex; flex-wrap: wrap; gap: .5em 1ch; align-items: center; margin: 1em 0 .4em; color: var(--dim); }
.ask .who .acts { margin-left: auto; display: flex; gap: .8ch; }
.ask .who b { color: var(--fg); }
.ask .answer { max-width: 96ch; }
.ask .cursor::after { content: "▍"; color: var(--leaf); animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .ask .cursor::after { animation: none; } }

/* chats */
.clist { max-height: 62vh; overflow: auto; margin: .6em -1ch 0; padding: 0 1ch; }
.citem { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 1.5ch; width: 100%; text-align: left; background: none; border: 0; border-top: 1px dashed color-mix(in srgb, var(--border) 70%, transparent); padding: .45em 0; }
.citem:first-child { border-top: 0; }
.citem b { font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.citem small { color: var(--faint); grid-column: 1 / -1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.citem time { color: var(--faint); }
.citem:hover b { color: var(--leaf); }
.citem[aria-current="true"] { box-shadow: inset 3px 0 0 var(--blossom); padding-left: 1.2ch; }
.citem[aria-current="true"] b { color: var(--blossom); font-weight: 700; }
.tree { overflow: auto; margin: 0 0 1em; padding-bottom: .3em; border-bottom: 1px dashed var(--border); }
.tree svg { display: block; }
.tnode { cursor: pointer; }
.tnode:hover circle { stroke: var(--fg); stroke-width: 2; }
.legend { color: var(--dim); font-size: .9em; margin-bottom: .4em; }
.thread { display: grid; gap: 1.1em; }
.turn { display: grid; grid-template-columns: 14ch minmax(0, 1fr); gap: 0 2ch; }
.turn .from { color: var(--sun); font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.turn.ai .from { color: var(--leaf); }
.turn .from canvas { width: 14px; height: 14px; margin-right: .6ch; }
.turn .meta { color: var(--faint); font-size: .9em; }
.sib { display: inline-flex; gap: .4ch; align-items: center; color: var(--dim); }
.sib button { background: none; border: 1px solid var(--border); border-radius: 4px; padding: 0 .7ch; color: var(--dim); }
.sib button:hover { color: var(--leaf); border-color: var(--leaf); }
.thought { color: var(--faint); border-left: 2px solid var(--border); padding-left: 1.2ch; margin: 0 0 .6em; white-space: pre-wrap; font-style: italic; }
.md p { margin: 0 0 .7em; } .md p:last-child { margin-bottom: 0; }
.md pre { background: var(--code); border: 1px solid var(--border); border-radius: 6px; padding: .7em 1.4ch; overflow: auto; margin: 0 0 .8em; }
.md code { background: var(--code); padding: 0 .5ch; border-radius: 3px; color: var(--sun); }
.md pre code { background: none; padding: 0; color: var(--fg); }
.md h3 { font-size: 1em; color: var(--blossom); margin: .8em 0 .3em; }
.md ul, .md ol { margin: 0 0 .7em; padding-left: 2.5ch; }
.md li::marker { color: var(--leaf); }

/* garden */
.beds { display: grid; grid-template-columns: repeat(auto-fill, minmax(30ch, 1fr)); gap: 1.2em 2.5ch; }
.bed { display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: .1em 1.6ch; align-items: center; padding: .7em 1.4ch; border: 1px solid var(--border); border-radius: 7px; }
.bed.cur { border-color: var(--leaf); box-shadow: inset 3px 0 0 var(--leaf); }
.bed canvas { width: 48px; height: 48px; grid-row: 1 / span 3; }
.bed b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bed small { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bed .acts { grid-column: 1 / -1; display: flex; gap: .6ch; margin-top: .5em; flex-wrap: wrap; }
.seeds .seed { display: grid; grid-template-columns: 24px minmax(0, 1fr) minmax(0, 22ch) auto; gap: 0 1.6ch; align-items: center; }
.seed canvas { width: 20px; height: 20px; }
.seed b { font-weight: 400; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seed small { color: var(--faint); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seed .price { color: var(--dim); font-size: .92em; text-align: right; }
.filters { display: flex; gap: .7ch; flex-wrap: wrap; align-items: center; margin: 0 0 1em; }
.filters .field { max-width: 34ch; }

/* usage bars, drawn in text */
.tbar { color: var(--leaf); letter-spacing: -.05em; white-space: nowrap; }
.tbar span { color: var(--border); }
.progress { color: var(--leaf); white-space: nowrap; overflow: hidden; }

/* colours */
.swatches { display: flex; gap: 1.2ch; flex-wrap: wrap; }
.swatch { border: 1px solid var(--border); border-radius: 7px; padding: .6em 1.4ch; width: 24ch; text-align: left; }
.swatch[aria-pressed="true"] { border-color: var(--leaf); box-shadow: inset 3px 0 0 var(--leaf); }
.swatch span { display: flex; gap: .5ch; margin-bottom: .4em; }
.swatch span i { width: 1.6ch; height: 1em; border-radius: 3px; display: block; }
.check { display: flex; gap: 1ch; align-items: flex-start; color: var(--dim); margin: .4em 0; cursor: pointer; }
.check input { accent-color: var(--leaf); margin-top: .35em; }
footer { margin-top: 3em; color: var(--faint); display: flex; gap: 2ch; flex-wrap: wrap; }

@media (max-width: 1000px) { .w3, .w4, .w5, .w6, .w7, .w8, .w9 { grid-column: span 12; } .clist { max-height: 30vh; } }
@media (max-width: 640px) {
  body { padding: 1em 1.5ch 2em; }
  .search input { width: 14ch; }
  .turn { grid-template-columns: 1fr; }
  .seeds .seed { grid-template-columns: 22px minmax(0, 1fr) auto; }
  .seed .price { display: none; }
  .ask > .aside { display: none; }
  header .rule { display: none; }
}
</style>
</head>
<body>
<header>
  <canvas id="rowan" class="px" aria-hidden="true"></canvas>
  <h1>tree of thought <span class="dim">·</span> dashboard</h1>
  <span id="ver" class="faint"></span>
  <span class="rule"></span>
  <form class="search" id="searchForm" role="search"><input id="q" type="search" placeholder="search every chat" aria-label="Search every chat (press / to start)" autocomplete="off"><kbd>/</kbd></form>
</header>
<nav class="tabs" aria-label="Sections">
  <button data-tab="chats">chats</button>
  <button data-tab="garden">garden</button>
  <button data-tab="computer">free models</button>
  <button data-tab="projects">projects</button>
  <button data-tab="usage">usage</button>
  <button data-tab="keys">keys</button>
  <button data-tab="network">network</button>
  <button data-tab="settings">settings</button>
</nav>
<main class="grid" id="main"></main>
<footer><span>runs on this computer only · your keys are never shown here</span><span>tot in the terminal: Tab opens the same things</span></footer>

<script>
(function () {
  'use strict';
  var CFG = /*TOT_CONFIG*/{};
  var API = (CFG.base || '') + '/api/';
  var S = null, tab = 'chats', chatList = [], chat = null, leaf = null, models = null, modelErr = [], netRes = null, ollama, pulling = null, usage = null, hits = null, query = '';
  var asking = null; // { name, maker, plant, text, note, err, done, chat }
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function ago(ts) { var s = (Date.now() - ts) / 1000; if (s < 60) return 'just now'; if (s < 3600) return Math.round(s / 60) + 'm ago'; if (s < 86400) return Math.round(s / 3600) + 'h ago'; if (s < 86400 * 30) return Math.round(s / 86400) + 'd ago'; return new Date(ts).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }); }
  function size(n) { var u = ['B', 'KB', 'MB', 'GB']; var i = 0; while (n >= 1024 && i < 3) { n /= 1024; i++; } return (i ? n.toFixed(1) : n) + ' ' + u[i]; }
  function num(x) { return x >= 1e6 ? (x / 1e6).toFixed(1) + 'M' : x >= 1e3 ? (x / 1e3).toFixed(1) + 'k' : String(x); }
  function box(w, title, aside, inner, cls) { return '<section class="box ' + w + (cls ? ' ' + cls : '') + '"><h2>' + title + '</h2>' + (aside ? '<span class="aside">' + aside + '</span>' : '') + inner + '</section>'; }
  function api(path, opts) {
    opts = opts || {};
    return fetch(API + path, { method: opts.method || (opts.body ? 'POST' : 'GET'), headers: opts.body ? { 'content-type': 'application/json' } : {}, body: opts.body ? JSON.stringify(opts.body) : undefined })
      .catch(function () { throw new Error("Can't reach Tree of Thought. Is tot (or tot dashboard) still running?"); })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok || j.error) throw new Error(j.error || 'error ' + r.status); return j; }); });
  }
  function lines(path, body, each) { // a streamed answer: one JSON object per line
    return fetch(API + path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) }).then(function (r) {
      if (!r.ok) return r.json().then(function (j) { throw new Error(j.error || 'error ' + r.status); });
      var reader = r.body.getReader(), dec = new TextDecoder(), buf = '';
      function more() {
        return reader.read().then(function (x) {
          if (x.done) return;
          buf += dec.decode(x.value, { stream: true });
          var i;
          while ((i = buf.indexOf('\n')) >= 0) { var l = buf.slice(0, i); buf = buf.slice(i + 1); if (l.trim()) { try { each(JSON.parse(l)); } catch (e) { /* half a line */ } } }
          return more();
        });
      }
      return more();
    });
  }

  // ── pixels ──
  function draw(cv, grid, ink, scale) {
    var w = Math.max.apply(null, grid.map(function (r) { return r.length; }));
    cv.width = w * scale; cv.height = grid.length * scale;
    var g = cv.getContext('2d');
    grid.forEach(function (row, y) { row.split('').forEach(function (c, x) { if (ink[c]) { g.fillStyle = ink[c]; g.fillRect(x * scale, y * scale, scale, scale); } }); });
    return cv;
  }
  function plantColor(name) { var p = S.plants[name] || S.plants.sprout; return p.ink[Object.keys(p.ink)[0]]; }
  function plantTag(name) { return '<canvas data-plant="' + esc(name || 'sprout') + '"></canvas>'; }
  function paintPlants(root) { root.querySelectorAll('canvas[data-plant]').forEach(function (c) { var p = S.plants[c.dataset.plant] || S.plants.sprout; draw(c, p.grid, p.ink, 4); c.classList.add('px'); }); }

  // ── theme ──
  function applyTheme() {
    var t = S.themes[S.settings.theme] || S.themes.grove, r = document.documentElement.style;
    r.setProperty('--bg', t.paper.bg); r.setProperty('--fg', t.paper.fg);
    ['dim', 'faint', 'border', 'code', 'leaf', 'blossom', 'bark', 'sun', 'water', 'err', 'warn', 'ok'].forEach(function (k) { if (t[k]) r.setProperty('--' + k, t[k]); });
    r.setProperty('--panel', t.select);
    var trimmed = S.rowan.filter(function (row) { return /[^.]/.test(row); });
    draw($('rowan'), trimmed, t.rowan, 2);
    try { $('icon').href = $('rowan').toDataURL(); } catch (e) { /* fine */ }
  }

  // ── sections ──
  document.querySelectorAll('[data-tab]').forEach(function (b) { b.onclick = function () { go(b.dataset.tab); }; });
  function go(t) {
    tab = t;
    if (location.hash.slice(1) !== t) history.replaceState(null, '', '#' + t);
    document.querySelectorAll('[data-tab]').forEach(function (b) { if (b.dataset.tab === t) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
    if (t === 'chats') api('chats').then(function (l) { chatList = l; render(); });
    if (t === 'garden' && !models) api('models').then(function (r) { models = r.list; modelErr = r.errors; render(); }, function () { models = []; render(); });
    if (t === 'computer') api('ollama').then(function (r) { ollama = r.models; render(); });
    if (t === 'usage') api('usage').then(function (r) { usage = r; render(); });
    render();
  }
  function render() {
    var m = $('main');
    var keep = document.activeElement && document.activeElement.id && m.contains(document.activeElement) ? { id: document.activeElement.id, at: document.activeElement.selectionStart } : null;
    var fn = { chats: chatsView, garden: gardenView, computer: computerView, projects: projectsView, usage: usageView, keys: keysView, network: networkView, settings: settingsView }[tab];
    m.innerHTML = fn();
    paintPlants(m);
    if (wire[tab]) wire[tab]();
    if (keep && $(keep.id)) { var el = $(keep.id); el.focus(); try { if (keep.at != null) el.setSelectionRange(keep.at, keep.at); } catch (e) { /* not text */ } }
  }
  var wire = {};

  // search every chat (press / to start)
  document.addEventListener('keydown', function (e) { if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); $('q').focus(); } });
  $('searchForm').onsubmit = function (e) { e.preventDefault(); query = $('q').value.trim(); if (!query) { hits = null; render(); return; } api('search?q=' + encodeURIComponent(query)).then(function (r) { hits = r; if (tab !== 'chats') go('chats'); else render(); }); };
  $('q').oninput = function () { if (!$('q').value) { hits = null; query = ''; if (tab === 'chats') render(); } };

  // ══ chats (and the quick-question bar) ══
  function askBox() {
    var m = S.garden.filter(function (x) { return x.current; })[0];
    var opts = S.garden.map(function (g) { var k = g.provider + ':' + g.id; return '<option value="' + esc(k) + '"' + (g.current ? ' selected' : '') + '>' + esc(g.name) + '</option>'; }).join('');
    var inner = '<form class="bar" id="askForm"><span class="prompt">›</span><input class="field grow" id="askQ" placeholder="' + (m ? 'ask anything…' : 'plant a model first (free models: the free models tab)') + '" autocomplete="off"' + (m ? '' : ' disabled') + '>' +
      (S.garden.length > 1 ? '<select class="field" id="askM" aria-label="Which model">' + opts + '</select>' : '') + '<button class="mini go" id="askGo"' + (m ? '' : ' disabled') + '>' + (asking && !asking.done ? 'stop' : 'ask') + '</button></form>';
    if (asking) {
      inner += '<div class="who">' + plantTag(asking.plant) + '<b>' + esc(asking.name) + '</b>' + (asking.maker ? ' · ' + esc(asking.maker) : '') + (asking.done && asking.chat ? '<span class="acts"><button class="mini" id="askMore">follow up</button><button class="mini" id="askOpen">open as a chat</button></span>' : '') + '</div>';
      if (asking.note) inner += '<p class="note">' + esc(asking.note) + '</p>';
      inner += '<div class="answer md' + (asking.done ? '' : ' cursor') + '">' + md(asking.text || '') + '</div>';
      if (asking.err) inner += '<p class="msg bad">' + esc(asking.err) + '</p>';
    }
    return box('w12', 'ask', '<span>quick answers · saved as a chat</span>', inner, 'ask');
  }
  var chatQuery = '';
  function chatsView() {
    var html = askBox();
    if (hits) {
      html += box('w12', 'search', esc(hits.length + ' chat' + (hits.length === 1 ? '' : 's') + ' with “' + query + '”') + ' <button class="mini" id="clearHits">clear</button>',
        hits.length ? '<div class="rows">' + hits.map(function (h) { return '<button class="citem" data-chat="' + h.id + '"><b>' + esc(h.title) + '</b><time>' + ago(h.updated) + '</time><small>…' + esc(h.hit) + '…</small></button>'; }).join('') + '</div>' : '<p class="empty">Nothing found.</p>');
    }
    var proj = {}; S.projects.forEach(function (p) { proj[p.id] = p.name; });
    var list = chatList.filter(function (c) { return !chatQuery || (c.title || '').toLowerCase().indexOf(chatQuery.toLowerCase()) >= 0; });

    if (!cur) return html + box('w8', 'project', '', '<p class="empty">Make a project on the left: like "Science fair" or "College essays".</p>');
    var files = cur.files.length ? '<div class="rows">' + cur.files.map(function (f) { return '<div class="line"><span class="grow" title="' + esc(f) + '">' + esc(f) + '</span><button class="mini bad" data-unpin="' + esc(f) + '">unpin</button></div>'; }).join('') + '</div>' : '<p class="empty">None yet.</p>';
    html += box('w8', esc(cur.name), (S.project === cur.id ? '<span class="pill ok">in use in tot</span><button class="mini" id="pLeave">stop using</button>' : '<button class="mini go" id="pUse">use in tot</button>') + '<button class="mini bad" id="pDel">delete</button>',
      '<label class="dim" for="pInst">Instructions every model gets in this project</label><textarea class="field" id="pInst" rows="5" placeholder="What it is, how you like answers, what to avoid.">' + esc(cur.instructions) + '</textarea><div class="line"><button class="mini go" id="pSave">save</button><span class="msg" id="pMsg"></span></div>' +
      '<h3 class="blossom" style="font-size:1em;margin:1.4em 0 .4em">Pinned files <span class="faint" style="font-weight:400">re-read before every answer, so edits show up</span></h3>' + files +
      '<form class="line" id="pPin" style="margin-top:.8em"><span class="prompt">+</span><input class="field grow" id="pFile" placeholder="/path/to/a/file.md"><button class="mini go">pin</button></form><div class="msg" id="pinMsg"></div>');
    wire._project = cur;
    return html;
  }
  wire.projects = function () {
    var cur = wire._project;
    var pa = function (body, after) { return api('projects', { body: body }).then(function (s) { S = s; render(); if (after) after(); }, function (e) { var m = $('pinMsg') || $('pMsg'); if (m) { m.className = 'msg bad'; m.textContent = e.message; } }); };
    document.querySelectorAll('[data-proj]').forEach(function (b) { b.onclick = function () { openProject = b.dataset.proj; render(); }; });
    $('pNew').onsubmit = function (e) { e.preventDefault(); var n = $('pName').value.trim(); if (n) pa({ action: 'add', name: n }, function () { openProject = S.projects[S.projects.length - 1].id; render(); }); };
    if (!cur) return;
    $('pSave').onclick = function () { pa({ action: 'save', id: cur.id, instructions: $('pInst').value }, function () { var m = $('pMsg'); if (m) m.textContent = 'Saved.'; }); };
    $('pPin').onsubmit = function (e) { e.preventDefault(); var f = $('pFile').value.trim(); if (f) pa({ action: 'pin', id: cur.id, file: f }); };
    document.querySelectorAll('[data-unpin]').forEach(function (b) { b.onclick = function () { pa({ action: 'unpin', id: cur.id, file: b.dataset.unpin }); }; });
    var x = $('pUse'); if (x) x.onclick = function () { pa({ action: 'use', id: cur.id }); };
    x = $('pLeave'); if (x) x.onclick = function () { pa({ action: 'leave', id: cur.id }); };
    $('pDel').onclick = function () { if (confirm('Delete the project "' + cur.name + '"? Its chats are kept.')) { openProject = null; pa({ action: 'delete', id: cur.id }); } };
  };

  // ══ usage ══
  function usageView() {
    if (!usage) return box('w12', 'usage', '', '<p class="empty">Adding it up…</p>');
    if (!usage.length) return box('w12', 'usage', '', '<p class="empty">Nothing yet: ask something first.</p>');
    var max = Math.max.apply(null, usage.map(function (r) { return r.in + r.out; })) || 1;
    var cost = usage.reduce(function (a, r) { return a + r.cost; }, 0);
    var answers = usage.reduce(function (a, r) { return a + r.answers; }, 0);
    var rows = usage.map(function (r) {
      var plant = (S.garden.filter(function (g) { return g.provider + ':' + g.id === r.model; })[0] || {}).plant;
      return '<tr><td>' + plantTag(plant || (r.model.indexOf('ollama:') === 0 ? 'acorn' : 'sprout')) + ' ' + esc(r.name) + '</td><td>' + r.answers + '</td><td>' + num(r.in) + '</td><td>' + num(r.out) + '</td><td>' + (r.cost ? '$' + r.cost.toFixed(4) : r.model.indexOf('ollama:') === 0 ? 'free' : '-') + '</td><td class="tbar">' + textBar((r.in + r.out) / max, 24) + '</td></tr>';
    }).join('');
    return box('w12', 'usage', answers + ' answers' + (cost ? ' · $' + cost.toFixed(4) + ' reported' : ''),
      '<p class="note">Counted in tokens (a token is about ¾ of a word). Services that report a cost (OpenRouter does) show it; models on this computer are always free.</p><table><thead><tr><th>model</th><th>answers</th><th>tokens in</th><th>out</th><th>cost</th><th></th></tr></thead><tbody>' + rows + '</tbody></table>');
  }

  // ══ keys ══
  function keysView() {
    var rows = S.providers.filter(function (p) { return !p.noKey; }).map(function (p) {
      var custom = p.custom ? '<form class="line" data-base style="margin-bottom:.4em"><span class="dim">address</span><input class="field grow" id="customBase" placeholder="https://example.com/v1" value="' + esc(S.settings.customBase) + '"><button class="mini">save</button></form>' : '';
      return '<tr><td><b>' + esc(p.name) + '</b><br><span class="faint">' + esc(p.about) + '</span></td><td>' + (p.hasKey ? '<span class="pill ok">saved</span>' : p.keyUrl ? '<a href="' + esc(p.keyUrl) + '" target="_blank" rel="noopener">get one</a>' : '') + '</td><td style="min-width:30ch">' + custom +
        '<form class="line" data-keyform="' + p.id + '"><span class="prompt">›</span><input class="field grow" type="password" autocomplete="off" placeholder="' + (p.hasKey ? 'paste a new key to replace it' : 'paste your key') + '" data-key="' + p.id + '"><button class="mini go">save</button>' + (p.hasKey ? '<button type="button" class="mini bad" data-del="' + p.id + '">remove</button>' : '') + '</form><div class="msg" id="km-' + p.id + '"></div></td></tr>';
    }).join('');
    return box('w12', 'keys', 'kept in ~/.tot/keys.json, never shown here', '<p class="note">A key lets Tree of Thought talk to an AI service for you. OpenRouter is the easy one: one key, every big model. Free and unlimited needs no key at all: see the free models tab.</p><table><thead><tr><th>service</th><th></th><th>key</th></tr></thead><tbody>' + rows + '</tbody></table>');
  }
  wire.keys = function () {
    document.querySelectorAll('[data-keyform]').forEach(function (f) {
      f.onsubmit = function (e) {
        e.preventDefault();
        var id = f.dataset.keyform, input = f.querySelector('input'), msg = $('km-' + id), btn = f.querySelector('.go');
        if (!input.value.trim()) { msg.className = 'msg bad'; msg.textContent = 'Paste a key first.'; return; }
        msg.className = 'msg'; msg.textContent = 'Checking it…'; btn.disabled = true;
        api('keys', { body: { provider: id, key: input.value } }).then(function (s) { S = s; models = null; render(); var m = $('km-' + id); if (m) m.textContent = 'Saved. Plant its models on the garden tab.'; }, function (er) { btn.disabled = false; msg.className = 'msg bad'; msg.textContent = er.message; });
      };
    });
    document.querySelectorAll('[data-del]').forEach(function (b) { b.onclick = function () { if (confirm('Remove this key from this computer?')) api('keys', { body: { provider: b.dataset.del, key: '' } }).then(function (s) { S = s; models = null; render(); }); }; });
    var sb = document.querySelector('[data-base]'); if (sb) sb.onsubmit = function (e) { e.preventDefault(); api('settings', { body: { customBase: $('customBase').value.trim() } }).then(function (s) { S = s; render(); }, function (er) { alert(er.message); }); };
  };

  // ══ network ══
  var WORDS = { ok: ['ok', 'works'], slow: ['warn', 'slow'], blocked: ['no', 'blocked'], inspected: ['warn', 'inspected'], off: ['no', 'not running'] };
  function chipFor(s) { if (!s) return '<span class="faint">-</span>'; var w = WORDS[s] || ['', s]; return '<span class="pill ' + w[0] + '">' + w[1] + '</span>'; }
  function networkView() {
    var inner = '<p class="note">Some networks (schools, offices) block some AI services. This checks which ones this computer can reach right now: the service itself, and the website where you get its key.</p>';
    if (netRes && netRes !== 'busy') {
      inner += '<table><thead><tr><th>service</th><th>answers questions</th><th>key website</th><th></th></tr></thead><tbody>' + netRes.map(function (r) {
        var note = r.api === 'inspected' ? 'This network swaps secure certificates (common at schools), so the connection isn\'t trusted.' : r.api === 'blocked' ? 'Blocked or not answering here.' : r.api === 'off' ? 'Start the Ollama app.' : r.site === 'blocked' ? 'Works here; get its key somewhere else.' : '';
        return '<tr><td>' + esc(r.name) + '</td><td>' + chipFor(r.api) + '</td><td>' + chipFor(r.site) + '</td><td class="dim">' + esc(note) + '</td></tr>';
      }).join('') + '</tbody></table>';
      var ok = netRes.filter(function (r) { return r.api === 'ok' && r.id !== 'ollama'; }).map(function (r) { return r.name; });
      inner += '<p class="note" style="margin-top:1em">' + (ok.length ? 'On this network you can use: <b>' + esc(ok.join(', ')) + '</b>. Keys you saved at home work here too.' : 'No online service gets through here. Free models on this computer still work: they don\'t need the internet.') + '</p>';
    }
    return box('w12', 'network check', '<button class="mini go" id="netGo"' + (netRes === 'busy' ? ' disabled' : '') + '>' + (netRes === 'busy' ? 'checking…' : 'check this network') + '</button>', inner);
  }
  wire.network = function () { $('netGo').onclick = function () { netRes = 'busy'; render(); api('network').then(function (r) { netRes = r; render(); }, function (e) { netRes = null; render(); alert(e.message); }); }; };

  // ══ settings ══
  function settingsView() {
    var sw = '<div class="swatches">' + Object.keys(S.themes).map(function (k) {
      var t = S.themes[k];
      return '<button class="swatch" data-theme="' + k + '" aria-pressed="' + (S.settings.theme === k) + '" style="background:' + t.paper.bg + ';color:' + t.paper.fg + '"><span><i style="background:' + t.leaf + '"></i><i style="background:' + t.blossom + '"></i><i style="background:' + t.bark + '"></i><i style="background:' + t.sun + '"></i></span><b>' + k + '</b><br><small style="opacity:.75">' + esc(t.about) + '</small></button>';
    }).join('') + '</div>';
    var html = box('w6', 'colours', 'the terminal uses them too', sw);
    html += box('w6', 'answers', '',
      '<label class="check"><input type="checkbox" id="fallback"' + (S.settings.fallback ? ' checked' : '') + '> <span><b style="color:var(--fg)">Stand-ins.</b> When a model is busy, over its limit or unreachable, the next one in your garden answers instead (free models on this computer first).</span></label>' +
      '<label class="check"><input type="checkbox" id="thoughts"' + (S.settings.thoughts ? ' checked' : '') + '> <span><b style="color:var(--fg)">Show thinking.</b> See what thinking models think while they answer.</span></label>');
    html += box('w12', 'instructions for every model', '', '<p class="note">Like "Answer briefly. I\'m learning to program." Projects can add their own on top.</p><textarea class="field" id="sys" rows="4">' + esc(S.settings.system) + '</textarea><div class="line"><button class="mini go" id="saveSys">save</button><span class="msg" id="sysMsg"></span></div>');
    return html;
  }
  wire.settings = function () {
    document.querySelectorAll('[data-theme]').forEach(function (b) { b.onclick = function () { api('settings', { body: { theme: b.dataset.theme } }).then(function (s) { S = s; applyTheme(); render(); }); }; });
    $('saveSys').onclick = function () { api('settings', { body: { system: $('sys').value } }).then(function (s) { S = s; $('sysMsg').textContent = 'Saved.'; }); };
    $('thoughts').onchange = function () { api('settings', { body: { thoughts: this.checked } }).then(function (s) { S = s; }); };
    $('fallback').onchange = function () { api('settings', { body: { fallback: this.checked } }).then(function (s) { S = s; }); };
  };

  // ── off we go ──
  api('state').then(function (s) {
    S = s;
    $('ver').textContent = 'v' + s.version;
    applyTheme();
    var h = location.hash.slice(1);
    go(['chats', 'garden', 'computer', 'projects', 'usage', 'keys', 'network', 'settings'].indexOf(h) >= 0 ? h : 'chats');
    api('chats').then(function (l) { chatList = l; if (l.length && !chat) openChat(l[0].id); });
  }, function (e) { $('main').innerHTML = '<p class="empty">' + esc(e.message) + '</p>'; });
})();
</script>
</body>
</html>
